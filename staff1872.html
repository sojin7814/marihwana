<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>쇼츠학개론 STAFF · 에셋 취합</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12121a;
  --bg-card: #1a1a26;
  --bg-input: #22222f;
  --bg-hover: #2a2a3a;
  --border: #2e2e40;
  --border-focus: #ff3344;
  --text-primary: #eeeef0;
  --text-secondary: #9999aa;
  --text-muted: #666678;
  --accent: #ff3344;
  --accent-dark: #cc1122;
  --accent-glow: rgba(255,51,68,0.15);
  --blue: #4488ff;
  --green: #44cc88;
  --yellow: #ffaa33;
  --danger: #ff4466;
  --toast-bg: #2a2a3a;
  --modal-overlay: rgba(0,0,0,0.7);
  --scrollbar-thumb: #333348;
  --star-color: #ffaa33;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Noto Sans KR', sans-serif; background:var(--bg-primary); color:var(--text-primary); line-height:1.5; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-track { background:var(--bg-secondary); }
::-webkit-scrollbar-thumb { background:var(--scrollbar-thumb); border-radius:5px; }

/* ===== HEADER ===== */
header {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 24px; background:var(--bg-secondary); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:50;
}
.header-left { display:flex; align-items:center; gap:10px; flex:1; }
.header-logo { height:30px; width:auto; }
.staff-badge {
  background:var(--yellow); color:#2a1c00; font-size:11px; font-weight:700;
  padding:3px 9px; border-radius:6px; letter-spacing:0.06em;
}
.header-title {
  flex:1; text-align:center; font-size:20px; font-weight:900;
  white-space:nowrap;
}
.header-right { flex:1; display:flex; justify-content:flex-end; gap:8px; align-items:center; }
.icon-btn {
  background:var(--bg-input); border:1px solid var(--border); color:var(--text-secondary);
  padding:7px 12px; border-radius:8px; cursor:pointer; font-size:13px; font-family:inherit;
  transition:all .15s;
}
.icon-btn:hover { border-color:var(--accent); color:var(--accent); }

.wrap { max-width:1240px; margin:0 auto; padding:20px 24px 60px; }


/* ===== WORKFLOW BAR ===== */
.workflow {
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  background:var(--bg-card); border:1px solid var(--border); border-radius:12px;
  padding:12px 16px; margin-bottom:16px;
}
.workflow .wf-label { font-size:12px; color:var(--text-muted); font-weight:700; margin-right:4px; }
.wf-step { font-size:12.5px; color:var(--text-secondary); background:var(--bg-input); padding:5px 11px; border-radius:7px; }
.wf-step b { color:var(--text-primary); }
.wf-arrow { color:var(--text-muted); font-size:12px; }

/* ===== DROPZONE ===== */
.dropzone {
  border:2px dashed var(--border); border-radius:14px; padding:26px 20px;
  text-align:center; cursor:pointer; transition:all .18s; background:var(--bg-secondary);
  margin-bottom:16px;
}
.dropzone:hover, .dropzone.drag { border-color:var(--accent); background:var(--accent-glow); }
.dropzone .dz-icon { font-size:34px; margin-bottom:6px; }
.dropzone .dz-main { font-size:15px; font-weight:700; }
.dropzone .dz-sub { font-size:12.5px; color:var(--text-secondary); margin-top:4px; }

/* ===== STATS ===== */
.stats { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:16px; }
.stat-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
.stat-card .s-label { font-size:12px; color:var(--text-secondary); }
.stat-card .s-val { font-size:26px; font-weight:900; margin-top:2px; }
.stat-card .s-val.accent { color:var(--accent); }

/* ===== SUBMITTERS ===== */
.section-title { font-size:14px; font-weight:700; margin:18px 0 10px; display:flex; align-items:center; gap:8px; }
.section-title .st-count { font-size:12px; color:var(--text-muted); font-weight:400; }
.submitter-box { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:8px; display:flex; flex-wrap:wrap; gap:6px; max-height:160px; overflow-y:auto; }
.submitter-chip {
  display:inline-flex; align-items:center; gap:6px; background:var(--bg-input);
  border:1px solid var(--border); border-radius:20px; padding:5px 11px; font-size:12.5px;
}
.submitter-chip .sc-name { color:var(--text-primary); }
.submitter-chip .sc-num { background:var(--accent); color:#fff; border-radius:10px; padding:0 7px; font-size:11px; font-weight:700; }
.empty-hint { color:var(--text-muted); font-size:13px; padding:10px; text-align:center; }

/* ===== TOOLBAR ===== */
.toolbar { display:flex; gap:10px; align-items:center; margin:18px 0 10px; flex-wrap:wrap; }
.search-input {
  flex:1; min-width:180px; background:var(--bg-input); border:1px solid var(--border); color:var(--text-primary);
  padding:9px 13px; border-radius:9px; font-size:13.5px; font-family:inherit;
}
.search-input:focus { outline:none; border-color:var(--accent); }
.btn {
  background:var(--bg-input); border:1px solid var(--border); color:var(--text-secondary);
  padding:9px 15px; border-radius:9px; cursor:pointer; font-size:13.5px; font-family:inherit; font-weight:500;
  transition:all .15s; white-space:nowrap;
}
.btn:hover { border-color:var(--accent); color:var(--accent); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.btn.primary:hover { background:var(--accent-dark); color:#fff; }
.btn.danger:hover { border-color:var(--danger); color:var(--danger); }

/* ===== TABLE ===== */
.table-wrap { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; overflow:auto; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap; }
th { background:var(--bg-secondary); color:var(--text-secondary); font-weight:700; cursor:pointer; user-select:none; position:sticky; top:0; }
th:hover { color:var(--accent); }
th.no-sort { cursor:default; }
th.no-sort:hover { color:var(--text-secondary); }
.sort-arrow { font-size:10px; margin-left:3px; }
td.num { text-align:right; font-variant-numeric:tabular-nums; }
tr:hover td { background:var(--bg-hover); }
.ch-link { color:var(--blue); text-decoration:none; cursor:pointer; }
.ch-link:hover { text-decoration:underline; }
.bench-badge { background:var(--accent-glow); color:var(--accent); border-radius:8px; padding:2px 9px; font-weight:700; font-size:12px; }
.type-cell { cursor:pointer; color:var(--text-primary); }
.type-cell:hover { color:var(--accent); }
.type-cell .ed-ic { font-size:10px; opacity:.5; margin-left:4px; }
.type-empty { color:var(--text-muted); font-style:italic; }

/* ===== TYPE DROPDOWN PANEL ===== */
.type-panel {
  display:none; position:absolute; z-index:200; width:260px; max-height:340px; overflow-y:auto;
  background:var(--bg-card); border:1px solid var(--accent); border-radius:12px; padding:10px;
  box-shadow:0 8px 30px rgba(0,0,0,.5);
}
.type-panel.open { display:block; }
.tp-input { width:100%; background:var(--bg-input); border:1px solid var(--border); color:var(--text-primary); padding:8px 10px; border-radius:8px; font-size:13px; font-family:inherit; margin-bottom:8px; }
.tp-input:focus { outline:none; border-color:var(--accent); }
.tp-group-label { font-size:11px; color:var(--text-muted); font-weight:700; margin:8px 2px 4px; }
.tp-item { display:flex; align-items:center; justify-content:space-between; padding:7px 9px; border-radius:7px; cursor:pointer; font-size:13px; }
.tp-item:hover { background:var(--bg-hover); }
.tp-item .tp-name { flex:1; }
.tp-item .tp-actions { display:flex; gap:6px; opacity:.6; }
.tp-item .tp-actions span:hover { opacity:1; }
.tp-fav { color:var(--star-color); }

/* ===== GUIDE ===== */
.guide { margin-top:28px; }
.guide-toggle {
  width:100%; text-align:left; background:var(--bg-card); border:1px solid var(--border);
  color:var(--text-primary); padding:14px 18px; border-radius:12px; cursor:pointer;
  font-size:14px; font-weight:700; font-family:inherit; display:flex; justify-content:space-between;
}
.guide-toggle:hover { border-color:var(--accent); }
.guide-body { display:none; background:var(--bg-secondary); border:1px solid var(--border); border-top:none; border-radius:0 0 12px 12px; padding:18px 22px; font-size:13.5px; line-height:1.85; color:var(--text-secondary); }
.guide-body.open { display:block; }
.guide-body h4 { color:var(--text-primary); font-size:14px; margin:16px 0 6px; }
.guide-body h4:first-child { margin-top:0; }
.guide-body b { color:var(--accent); }

/* ===== TOAST ===== */
#toast {
  position:fixed; bottom:28px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--toast-bg); color:var(--text-primary); padding:13px 22px; border-radius:10px;
  font-size:14px; opacity:0; pointer-events:none; transition:all .25s; z-index:300; border:1px solid var(--border);
}
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
#toast.error { border-color:var(--danger); }
#toast.success { border-color:var(--green); }

@media (max-width:680px){
  .stats { grid-template-columns:1fr; }
  .header-title { font-size:16px; }
}
</style>
</head>

<div class="type-panel" id="type-panel"></div>
<div id="toast"></div>

<script>
/* =========================================================
   쇼츠학개론 STAFF · 에셋 취합  (staff1872.html)
   - 저장: localStorage(절충안) + 마스터 CSV
   - 돈통(index.html) 채널 CSV 호환: 10칸 + 제출자 1칸(11번째, 돈통은 무시)
   ========================================================= */

const YT_CATEGORIES = [
  '영화/애니','자동차','음악','반려동물','여행/이벤트','게임',
  '일상/브이로그','코미디','엔터테인먼트','뉴스/정치','노하우/스타일',
  '교육','과학/기술','비영리/사회','먹방/요리','ASMR','재테크/경제'
];

/* ===== STATE ===== */
let channels = JSON.parse(localStorage.getItem('staff_channels') || '[]');
let customTypes = JSON.parse(localStorage.getItem('staff_custom_types') || '[]');
let favTypes = JSON.parse(localStorage.getItem('staff_fav_types') || '[]');
let sortKey = 'bench', sortDir = 'desc';
let activePanelId = null;
let submittersCollapsed = null; // null=자동(30명초과시 접힘), true/false=사용자 선택

function save() {
  localStorage.setItem('staff_channels', JSON.stringify(channels));
  localStorage.setItem('staff_custom_types', JSON.stringify(customTypes));
  localStorage.setItem('staff_fav_types', JSON.stringify(favTypes));
}

/* ===== 유틸 ===== */
function esc(str){ if(str===0) return '0'; if(!str) return ''; return str.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
/* URL 안전화: http/https 절대주소만 통과, javascript: 등 위험 스킴은 '#' */
function safeUrl(url){ url=(url||'').trim(); try{ const u=new URL(url); if(u.protocol==='http:'||u.protocol==='https:') return url; }catch(e){} return '#'; }
function genId(){ return Date.now()*1000 + Math.floor(Math.random()*1000); }
function fmt(n){ return (parseInt(n)||0).toLocaleString('ko-KR'); }

/* CSV 셀: 따옴표 이스케이프 + 엑셀 수식 인젝션 방지 */
function csvCell(v){ v=(v||'').toString(); if(/^[=+\-@]/.test(v)) v="'"+v; return '"'+v.replace(/"/g,'""')+'"'; }

/* 숫자 변환: 엑셀이 박은 천단위 콤마·공백·기타문자 제거 후 정수화 ("206,000"→206000) */
function toInt(v){ return parseInt(String(v==null?'':v).replace(/[^\d]/g,''),10)||0; }

/* http(s) 없는 주소 보정 ("www.youtube.com/..."→"https://www.youtube.com/...") */
function normUrl(u){ u=(u||'').trim(); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u='https://'+u; return u; }

/* 행에서 채널 링크 찾기: 정위치(링크칸)가 비었거나 엑셀로 칸이 밀린 파일 대비.
   정해진 링크칸을 먼저 보고, 유튜브 주소가 아니면 행 전체에서 유튜브 주소처럼 생긴 칸을 탐색. */
function findChannelUrl(r, linkIdx){
  const isYt = s => /(?:youtube\.com|youtu\.be)/i.test(String(s||''));
  if(isYt(r[linkIdx])) return normUrl(r[linkIdx]);
  const hit = r.find(c => isYt(c));
  if(hit) return normUrl(hit);
  return r[linkIdx] ? normUrl(r[linkIdx]) : '';
}

/* 채널명 끝에 구독자수가 붙어버린 경우만 제거 ("네 이름은 이효리307,000"→"네 이름은 이효리").
   구독자값과 정확히 일치할 때만 떼므로 "1분스킬","10초뉴스" 같은 정상 이름은 건드리지 않음. */
function cleanChannelName(name, subs){
  let n=(name||'').trim();
  const a=String(subs||'').trim();           // "307,000"
  const b=a.replace(/[^\d]/g,'');             // "307000"
  for(const t of [a,b]){ if(t && t.length>=2 && n.endsWith(t)){ n=n.slice(0,-t.length).trim(); break; } }
  return n;
}

/* 링크 기준 중복키 (돈통과 동일 로직): 채널ID > 핸들 > 링크 > 채널명 */
function channelDedupKey(url, name){
  const u=(url||'').trim().toLowerCase();
  if(u){
    const idMatch=u.match(/\/channel\/(uc[0-9a-z_-]+)/i); if(idMatch) return 'id:'+idMatch[1];
    const handleMatch=u.match(/@([^/?#\s]+)/); if(handleMatch) return 'handle:'+handleMatch[1];
    let cleaned=u.split('?')[0].split('#')[0].replace(/\/(shorts|videos|featured|about|streams|playlists)\/?$/,'').replace(/\/+$/,'');
    if(cleaned) return 'url:'+cleaned;
  }
  return 'name:'+(name||'').trim().toLowerCase();
}

/* 제출자 이름 정규화: 구분자(;)와 앞뒤 공백 제거 (CSV 왕복 시 한 명이 둘로 쪼개지는 것 방지) */
function cleanSubmitter(s){ return (s||'').toString().replace(/;/g,' ').replace(/\s+/g,' ').trim(); }

/* 파일명에서 제출자 추출: 에셋_채널_{이름}_YYYY-MM-DD.csv */
function submitterFromFilename(fname){
  const base=fname.replace(/\.csv$/i,'');
  const m=base.match(/^에셋_채널_(.+)_\d{4}-\d{2}-\d{2}$/);
  if(m) return cleanSubmitter(m[1]);
  // 형식이 다르면 파일명 그대로(확장자만 제거) — 스태프가 식별하도록
  return cleanSubmitter(base);
}

/* CSV 파서 (돈통과 동일) */
function parseCSVRows(text){
  const rows=[]; let row=[], cell='', inQuote=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuote){
      if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}
      else if(c==='"'){inQuote=false;}
      else {cell+=c;}
    } else {
      if(c==='"'){inQuote=true;}
      else if(c===','){row.push(cell.trim());cell='';}
      else if(c==='\n'||(c==='\r'&&text[i+1]==='\n')){row.push(cell.trim());rows.push(row);row=[];cell='';if(c==='\r')i++;}
      else {cell+=c;}
    }
  }
  if(cell||row.length){row.push(cell.trim());rows.push(row);}
  return rows;
}

/* ===== 파일 가져오기 (여러 개) ===== */
function handleFiles(fileList){
  const files=Array.from(fileList||[]).filter(f=>/\.csv$/i.test(f.name));
  if(!files.length){ toast('CSV 파일이 없습니다','error'); return; }
  let pending=files.length;
  let totalAdded=0, totalMerged=0, totalSkipped=0, badFiles=[];
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=function(e){
      const res=ingestOneFile(e.target.result, file.name);
      if(res.bad){ badFiles.push(file.name); }
      else { totalAdded+=res.added; totalMerged+=res.merged; totalSkipped+=res.skipped; }
      if(--pending===0){
        save(); renderAll();
        let msg=`✅ 채널 ${totalAdded}개 추가, ${totalMerged}건 중복 병합`;
        if(badFiles.length) msg+=` · ⚠️ 형식 안 맞는 파일 ${badFiles.length}개 건너뜀`;
        toast(msg, badFiles.length?'error':'success');
      }
    };
    reader.readAsText(file,'utf-8');
  });
}

function ingestOneFile(text, fname){
  text=text.replace(/^\uFEFF/,'');
  const rows=parseCSVRows(text);
  if(rows.length<2) return {bad:true};
  const header=rows[0];
  const headerStr=header.join(',');
  // 채널 CSV인지 검사 (소재·BGM·틱톡 파일 차단)
  const need=['채널명','구독자','영상수','조회수'];
  if(!need.every(k=>headerStr.includes(k))) return {bad:true};

  const hasSubmitterCol = headerStr.includes('제출자'); // 마스터 파일이면 true
  const fileSubmitter = submitterFromFilename(fname);   // 수강생 파일용

  let added=0, merged=0, skipped=0;
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    if(r.length<4){ skipped++; continue; } // 채널명·숫자 기본칸도 없으면 깨진 줄 → 스킵
    while(r.length<11) r.push(''); // 엑셀에서 뒤칸 잘린 파일 대비: 부족분을 빈칸으로 채워 살림
    // 10칸: 채널명,구독자,영상수,조회수,평균조회수(버림),유형,스크랩이유,레퍼런스,결,링크 [,제출자]
    const subs=r[1], videos=r[2], views=r[3], type=r[5];
    const url=findChannelUrl(r, 9);            // 링크칸이 비거나 칸이 밀려도 행에서 유튜브 주소 탐색
    const name=cleanChannelName(r[0], subs);   // 이름 끝에 붙은 구독자수 제거(정확히 일치할 때만)
    if(!name && !url){ skipped++; continue; }
    // 제출자 결정
    let subs_list;
    if(hasSubmitterCol && r[10]) subs_list = r[10].split(';').map(s=>cleanSubmitter(s)).filter(Boolean);
    else subs_list = [fileSubmitter];

    const key=channelDedupKey(url,name);
    const existing=channels.find(c=>channelDedupKey(c.url,c.name)===key);
    if(existing){
      // 데이터는 first-wins 유지, 제출자만 합집합으로 누적
      let newOnes=0;
      subs_list.forEach(s=>{ if(s && !existing.submitters.includes(s)){ existing.submitters.push(s); newOnes++; } });
      merged++;
    } else {
      channels.push({
        id: genId(),
        name, url,
        subs: toInt(subs),
        videos: toInt(videos),
        views: toInt(views),
        type: type||'',
        submitters: subs_list.filter(Boolean)
      });
      added++;
    }
  }
  return {added, merged, skipped};
}

/* ===== 집계 ===== */
function computeSubmitterCounts(){
  // 제출자 -> 제출한 채널 수 (제출자가 submitters에 들어있는 채널 수)
  const map={};
  channels.forEach(c=>{ (c.submitters||[]).forEach(s=>{ map[s]=(map[s]||0)+1; }); });
  return map;
}

function renderStats(){
  const counts=computeSubmitterCounts();
  const people=Object.keys(counts).length;
  document.getElementById('stat-channels').textContent=fmt(channels.length);
  document.getElementById('stat-people').textContent=fmt(people);

  // 제출자 칩
  const box=document.getElementById('submitter-box');
  const names=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  document.getElementById('people-hint').textContent = people? `(${people}명)` : '';
  if(!names.length){ box.innerHTML='<div class="empty-hint">아직 가져온 파일이 없습니다.</div>'; }
  else { box.innerHTML=names.map(n=>`<span class="submitter-chip"><span class="sc-name">${esc(n)}</span><span class="sc-num">${counts[n]}</span></span>`).join(''); }

  // 접힘 상태: 기본은 항상 접힘, 한 번 클릭하면 그 선택을 따름
  const collapsed = (submittersCollapsed===null) ? true : submittersCollapsed;
  box.style.display = collapsed ? 'none' : 'flex';
  document.getElementById('submitter-arrow').textContent = names.length ? (collapsed?'▾':'▴') : '';
}
function toggleSubmitters(){
  const cur = (submittersCollapsed===null) ? true : submittersCollapsed;
  submittersCollapsed = !cur;
  renderStats();
}

/* ===== 테이블 ===== */
const COLS=[
  {key:'name',label:'채널명'},
  {key:'subs',label:'구독자',num:true},
  {key:'videos',label:'영상수',num:true},
  {key:'views',label:'조회수',num:true},
  {key:'avg',label:'평균조회수',num:true},
  {key:'type',label:'유형'},
  {key:'bench',label:'벤치마킹 횟수',num:true},
  {key:'link',label:'링크',nosort:true}
];

function avgOf(c){ return c.videos>0? Math.round(c.views/c.videos):0; }
function benchOf(c){ return (c.submitters||[]).length; }

function sortBy(key){
  if(COLS.find(c=>c.key===key && c.nosort)) return;
  if(sortKey===key) sortDir=(sortDir==='asc'?'desc':'asc');
  else { sortKey=key; sortDir=(key==='name'||key==='type')?'asc':'desc'; }
  renderTable();
}

function renderThead(){
  document.getElementById('thead-row').innerHTML=COLS.map(c=>{
    const arrow = sortKey===c.key ? `<span class="sort-arrow">${sortDir==='asc'?'▲':'▼'}</span>` : '';
    return `<th class="${c.nosort?'no-sort':''}" ${c.nosort?'':`onclick="sortBy('${c.key}')"`}>${c.label}${arrow}</th>`;
  }).join('');
}

function renderTable(){
  renderThead();
  const q=(document.getElementById('search').value||'').trim().toLowerCase();
  let list=channels.slice();
  if(q) list=list.filter(c=> (c.name||'').toLowerCase().includes(q) || (c.type||'').toLowerCase().includes(q));
  list.sort((a,b)=>{
    let va,vb;
    switch(sortKey){
      case 'name': va=(a.name||''); vb=(b.name||''); return sortDir==='asc'?va.localeCompare(vb,'ko'):vb.localeCompare(va,'ko');
      case 'type': va=(a.type||''); vb=(b.type||''); return sortDir==='asc'?va.localeCompare(vb,'ko'):vb.localeCompare(va,'ko');
      case 'avg': va=avgOf(a); vb=avgOf(b); break;
      case 'bench': va=benchOf(a); vb=benchOf(b); break;
      default: va=a[sortKey]||0; vb=b[sortKey]||0;
    }
    return sortDir==='asc'? va-vb : vb-va;
  });

  const tb=document.getElementById('tbody');
  if(!list.length){ tb.innerHTML=`<tr><td colspan="${COLS.length}" style="text-align:center;color:var(--text-muted);padding:30px;">${channels.length?'검색 결과가 없습니다.':'CSV 파일을 가져오면 여기에 표시됩니다.'}</td></tr>`; return; }
  tb.innerHTML=list.map(c=>{
    const link=c.url? `<a class="ch-link" href="${esc(safeUrl(c.url))}" target="_blank" rel="noopener noreferrer">바로가기 ↗</a>` : '<span style="color:var(--text-muted)">-</span>';
    const nameCell = c.url? `<a class="ch-link" href="${esc(safeUrl(c.url))}" target="_blank" rel="noopener noreferrer">${esc(c.name)}</a>` : esc(c.name);
    const typeDisp = c.type? `${esc(c.type)}<span class="ed-ic">✏️</span>` : `<span class="type-empty">미분류 ✏️</span>`;
    return `<tr>
      <td>${nameCell}</td>
      <td class="num">${fmt(c.subs)}</td>
      <td class="num">${fmt(c.videos)}</td>
      <td class="num">${fmt(c.views)}</td>
      <td class="num">${fmt(avgOf(c))}</td>
      <td class="type-cell" onclick="openTypePanel(event, ${c.id})">${typeDisp}</td>
      <td class="num"><span class="bench-badge">${benchOf(c)}</span></td>
      <td>${link}</td>
    </tr>`;
  }).join('');
}

/* ===== 유형 드롭다운 (직접입력 > 즐겨찾기 > YT카테고리) ===== */
function openTypePanel(ev, id){
  ev.stopPropagation();
  activePanelId=id;
  const panel=document.getElementById('type-panel');
  panel.innerHTML=buildPanelHTML();
  panel.classList.add('open');
  // 위치
  const rect=ev.currentTarget.getBoundingClientRect();
  const pw=260;
  let left=rect.left+window.scrollX;
  if(left+pw>window.scrollX+window.innerWidth-10) left=window.scrollX+window.innerWidth-pw-10;
  panel.style.left=left+'px';
  panel.style.top=(rect.bottom+window.scrollY+4)+'px';
  setTimeout(()=>{ const inp=document.getElementById('tp-input'); if(inp) inp.focus(); },30);
}
function buildPanelHTML(){
  let h=`<input class="tp-input" id="tp-input" placeholder="직접 입력 후 Enter" onkeydown="if(event.key==='Enter'){applyDirectType(this.value)}">`;
  if(customTypes.length){
    h+=`<div class="tp-group-label">직접입력 항목</div>`;
    h+=customTypes.map(t=>tpItem(t,true)).join('');
  }
  if(favTypes.length){
    h+=`<div class="tp-group-label">⭐ 즐겨찾기</div>`;
    h+=favTypes.map(t=>tpItem(t,false)).join('');
  }
  h+=`<div class="tp-group-label">YT 카테고리</div>`;
  h+=YT_CATEGORIES.map(t=>tpItem(t,false)).join('');
  return h;
}
function tpItem(t, isCustom){
  const faved=favTypes.includes(t);
  return `<div class="tp-item">
    <span class="tp-name" onclick="setType('${encodeURIComponent(t)}')">${esc(t)}</span>
    <span class="tp-actions">
      <span class="${faved?'tp-fav':''}" title="즐겨찾기" onclick="toggleFav('${encodeURIComponent(t)}')">★</span>
      ${isCustom?`<span title="삭제" onclick="delCustom('${encodeURIComponent(t)}')">🗑</span>`:''}
    </span>
  </div>`;
}
function applyDirectType(val){
  val=(val||'').trim(); if(!val) return;
  if(!customTypes.includes(val) && !YT_CATEGORIES.includes(val)) customTypes.unshift(val);
  setTypeRaw(val);
}
function setType(enc){ setTypeRaw(decodeURIComponent(enc)); }
function setTypeRaw(val){
  const c=channels.find(x=>x.id===activePanelId);
  if(c){ c.type=val; save(); renderTable(); }
  closePanel();
}
function toggleFav(enc){
  const t=decodeURIComponent(enc);
  const i=favTypes.indexOf(t);
  if(i>=0) favTypes.splice(i,1); else favTypes.push(t);
  save();
  document.getElementById('type-panel').innerHTML=buildPanelHTML();
}
function delCustom(enc){
  const t=decodeURIComponent(enc);
  customTypes=customTypes.filter(x=>x!==t);
  const fi=favTypes.indexOf(t); if(fi>=0) favTypes.splice(fi,1);
  save();
  document.getElementById('type-panel').innerHTML=buildPanelHTML();
}
function closePanel(){ const p=document.getElementById('type-panel'); p.classList.remove('open'); activePanelId=null; }
document.addEventListener('click',e=>{
  const panel=document.getElementById('type-panel');
  if(panel.classList.contains('open') && !panel.contains(e.target) && !e.target.closest('.type-cell')) closePanel();
});

/* ===== 마스터 내보내기 (10칸 + 제출자 / 돈통 호환) ===== */
function exportMaster(){
  if(!channels.length){ toast('내보낼 데이터가 없습니다','error'); return; }
  const header='채널명,구독자,영상수,조회수,평균조회수,유형,스크랩이유,레퍼런스,결,링크,제출자\n';
  let csv=header;
  channels.forEach(c=>{
    const avg=avgOf(c);
    const submitterStr=(c.submitters||[]).join(';');
    const row=[c.name, c.subs, c.videos, c.views, avg, c.type, '', '', '', c.url, submitterStr];
    csv+=row.map(csvCell).join(',')+'\n';
  });
  const today=new Date().toISOString().slice(0,10);
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`마스터_취합_${today}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('✅ 마스터 파일을 내보냈습니다. 공유 폴더에 덮어쓰세요!','success');
}

/* ===== 초기화 ===== */
function resetAll(){
  if(!channels.length){ toast('비어 있습니다','error'); return; }
  if(!confirm('현재 페이지에 모인 데이터를 모두 지웁니다.\n(마스터 파일을 먼저 내보냈는지 확인하세요!)\n\n계속할까요?')) return;
  if(!confirm('정말 지울까요? 이 작업은 되돌릴 수 없습니다.')) return;
  channels=[]; save(); renderAll();
  toast('초기화되었습니다','success');
}

const dz=document.getElementById('dropzone');
['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag');}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag');}));
dz.addEventListener('drop',e=>{ if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); });
